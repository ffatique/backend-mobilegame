name: Reposição diária de iscas
on:
  schedule:
    - cron: '17 2,4 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Conferir execução confirmada no PostgreSQL
        run: curl --fail --silent --show-error --retry 2 --max-time 20 https://api.mylittlepier.com/health/bait
